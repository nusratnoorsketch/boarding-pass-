<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PMO &amp; SMO Secret Share</title>
<meta name="description" content="Share one fun fact or lighthearted secret for PMO & SMO Day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;800;900&display=swap">
<style>
/* Pastel coral, yellow and pink glow on the grey stage. One centred card on a glowing stage. Built for a laptop screen first (link goes out by email), still fine on a phone. */
:root{
  --pink:#F7B6CB;       /* pastel pink */
  --coral:#F9B49B;      /* pastel coral */
  --yellow:#FBE38E;     /* pastel butter yellow */
  --peach:#FCD5C0;
  --candy:linear-gradient(100deg,var(--yellow),var(--coral) 50%,var(--pink));
  --grey:#454546;       /* Centennial Grey */
  --grey-deep:#2F2F30;
  --paper:#FFFFFF;
  --font:"Franklin Gothic URW","Libre Franklin","Franklin Gothic Medium",Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px 16px;
  background:var(--grey-deep);color:var(--paper);font-family:var(--font);overflow-x:hidden}

/* Glow layer */
.glow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.glow i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55;animation:drift 18s ease-in-out infinite alternate}
.glow i:nth-child(1){width:46vmax;height:46vmax;background:var(--pink);left:-12vmax;top:-14vmax}
.glow i:nth-child(2){width:38vmax;height:38vmax;background:var(--coral);right:-10vmax;bottom:-12vmax;animation-delay:-6s;opacity:.4}
.glow i:nth-child(3){width:26vmax;height:26vmax;background:var(--yellow);right:18vw;top:-8vmax;animation-delay:-11s;opacity:.3}
.glow i:nth-child(4){width:22vmax;height:22vmax;background:var(--peach);left:14vw;bottom:-10vmax;animation-delay:-3s;opacity:.3}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(4vmax,3vmax) scale(1.12)}}

/* Card */
.card{position:relative;z-index:1;width:100%;max-width:600px;text-align:center;
  padding:clamp(36px,6vw,64px) clamp(24px,5vw,56px);border-radius:28px;
  background:rgba(69,69,70,.72);border:1px solid rgba(247,182,203,.45);
  box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 0 80px rgba(249,180,155,.22),0 30px 80px rgba(0,0,0,.35);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

.seal{width:84px;height:84px;margin:0 auto 26px;border-radius:50%;display:grid;place-items:center;
  background:var(--candy);color:var(--grey);box-shadow:0 0 0 10px rgba(247,182,203,.16),0 0 50px rgba(247,182,203,.6);
  animation:breathe 3.2s ease-in-out infinite}
.seal svg{width:40px;height:40px}
@keyframes breathe{50%{box-shadow:0 0 0 16px rgba(251,227,142,.1),0 0 70px rgba(249,180,155,.85)}}

.eyebrow{margin:0 0 14px;font-size:13px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--pink)}
h1{margin:0;font-size:clamp(44px,7vw,72px);line-height:.95;font-weight:900;letter-spacing:-.02em;
  color:var(--paper);text-shadow:0 0 34px rgba(247,182,203,.35)}
h1 em{font-style:normal;background:var(--candy);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 0 18px rgba(249,180,155,.55))}
.lead{margin:22px auto 10px;max-width:38ch;font-size:clamp(17px,1.6vw,19px);line-height:1.55;color:rgba(255,255,255,.88)}

.keep{margin:0 auto 34px;font-size:clamp(19px,1.9vw,22px);font-weight:800;font-style:italic;color:var(--yellow);text-shadow:0 0 22px rgba(251,227,142,.45)}
.btn{display:inline-flex;align-items:center;gap:10px;padding:18px 34px;border-radius:999px;
  background:var(--candy);color:var(--grey);font:inherit;font-size:18px;font-weight:800;text-decoration:none;
  box-shadow:0 0 0 0 rgba(247,182,203,.55),0 0 36px rgba(247,182,203,.55);
  transition:transform .15s ease,box-shadow .2s ease;animation:pulse 2.6s ease-out infinite}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 6px rgba(247,182,203,.2),0 0 56px rgba(249,180,155,.85)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:3px solid var(--paper);outline-offset:4px}
.btn svg{width:20px;height:20px}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(247,182,203,.5),0 0 36px rgba(247,182,203,.55)}70%{box-shadow:0 0 0 16px rgba(247,182,203,0),0 0 36px rgba(247,182,203,.55)}100%{box-shadow:0 0 0 0 rgba(247,182,203,0),0 0 36px rgba(247,182,203,.55)}}

.fine{margin:22px 0 0;font-size:14px;color:rgba(255,255,255,.62)}

@media (prefers-reduced-motion:reduce){.glow i,.seal,.btn{animation:none}}
</style>
</head>
<body>

<div class="glow" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

<main class="card">
  <div class="seal" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10.5" width="16" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor"/></svg>
  </div>
  <p class="eyebrow">PMO &amp; SMO Day</p>
  <h1>Got a <em>secret?</em></h1>
  <p class="lead">Share one fun fact or lighthearted secret about yourself.</p>
  <p class="keep">We will keep it with us… until Nov 4.</p>
  <a class="btn" id="shareLink" href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=06RqMe708Eic587y4eKjMakaUx-rEyZPpOQGDalN6C9UN0cwVlpFV0ZMRjUwTkhLSFE0VlM1QThBSi4u" target="_blank" rel="noopener">
    Share my secret
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
  </a>
  <p class="fine">Shh… don't tell your teammates.</p>
</main>

</body>
</html>
